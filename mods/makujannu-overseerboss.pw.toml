# Custom, locally-built mod (not on CurseForge/Modrinth): server-side mixin
# adding boss attack patterns. For the Overseer (watcher) Warden variant: an
# AoE shockwave, a berserk block-breaking charge, and a post-charge groggy
# (slowness+weakness+glowing) window. For Elder Guardian: once below 50% HP,
# a periodic charge-dash attack. Both are type-checked in the mixin so no
# other Warden variant or regular Guardian is affected. Server-only logic,
# no client assets, but shipped to both sides for consistency with the rest
# of the pack.
name = "Maku Jannu Overseer Boss Patterns"
filename = "makujannu-overseerboss-1.0.0.jar"
side = "both"

