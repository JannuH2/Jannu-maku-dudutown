# Custom, locally-built mod (not on CurseForge/Modrinth): SimplySwords items
# use Simply Tooltips' own custom tooltip box, which only forwards vanilla
# tooltip lines into its "extra lines" section if they come after a vanilla
# attribute-modifier header - the Power Level line usually prints before
# that header, so it silently disappeared. This mixin re-attaches that line
# to the returned tooltip model directly from the raw vanilla lines the
# provider already received.
# 1.0.1: matched the line by dungeon_difficulty's private-use glyph
# (U+1CEE0) instead of the literal English "Power Level:" text - the
# server's Korean patch resourcepack translates that text to "전투력:",
# so the 1.0.0 English-only match never found it on this server at all.
name = "Maku Jannu Simply Tooltips Power Level Compat"
filename = "makujannu-simplytooltips-powerlevel-fix-1.0.1.jar"
side = "client"

[download]
url = "https://jannuh2.github.io/Jannu-maku-dudutown/mods/makujannu-simplytooltips-powerlevel-fix-1.0.1.jar"
