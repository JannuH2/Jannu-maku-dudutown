# Custom, locally-built mod (not on CurseForge/Modrinth): overrides attack
# damage / armor / armor toughness / max health for specific items across any
# mod via config/makujannu_statoverride.json, at the vanilla attribute_modifiers
# component level. Needed on both sides so tooltips render the same values
# combat actually uses. Also applies the Warden sword/axe on-hit Blindness+Darkness
# ("vision reduction") effect via Fabric API's ServerLivingEntityEvents.AFTER_DAMAGE.
name = "Maku Jannu Stat Override"
filename = "makujannu-statoverride-1.0.0.jar"
side = "both"

