# Custom, locally-built mod (not on CurseForge/Modrinth): registers an EMI
# exclusion area (via EMI's public EmiRegistry.addExclusionArea API) for
# Sophisticated Backpacks/Storage's shared StorageScreenBase, reading its
# own getUpgradeSlotsRectangle() so EMI's sidebar/search bar moves out of
# the way when the upgrade-slot panel is expanded instead of overlapping it.
# Pure client plugin, no mixin.
name = "Maku Jannu EMI Exclusion Fix"
filename = "makujannu-emi-exclusion-1.0.0.jar"
side = "both"

