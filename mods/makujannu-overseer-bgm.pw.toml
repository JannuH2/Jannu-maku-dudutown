# Custom, locally-built mod (not on CurseForge/Modrinth): pure client-asset
# mod (no Java code) adding the custom sound event "makujannu:music.overseer_boss"
# (THE WARDEN BOSS THEME, converted to OGG, volume reduced ~30%, 3s fade-in/out
# baked into the file). A server-side datapack (makujannu_overseer_bgm, shipped
# with the world save) triggers playsound/stopsound based on proximity to an
# alive Overseer. Needed on the client to actually hear the sound; harmless on
# the server.
