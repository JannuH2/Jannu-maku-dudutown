# "Boss Music Mod" by TheExiledFellow (https://modrinth.com/mod/exileds-boss-music-mod).
# Plays boss music when a Wither or Ender Dragon is active. Originally distributed by
# the author as two separate files (a small trigger datapack + a required resource
# pack); this jar is a local repackaging combining both into one Fabric mod (data/ +
# assets/) for simpler distribution through this pack. Found installed on the server
# but missing from this repo -- added so all players actually receive the audio.
name = "Boss Music Mod"
filename = "Boss Music Mod 1.21.x v1.2.1.jar"
side = "both"

