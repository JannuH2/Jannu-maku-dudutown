# Custom, locally-built mod (not on CurseForge/Modrinth): dungeon_difficulty's
# loot_scaling "power" attribute (config/dungeon_difficulty/difficulty_v2.json
# weapons[].attributes[]) has no native chance field - it always applies
# whenever a weapon gets scaled at all. Mixin gates it to a 25% chance per
# item (the "damage" scaling attribute always still applies; only "power"
# is now a coin-flip) via a @ModifyVariable on ItemScaling.applyModifiersForItemStack.
#
# 1.0.1: fixed smithing-table upgrades (e.g. diamond->netherite) randomly
# losing or re-rolling the power level instead of carrying it over exactly.
# dungeon_difficulty's own SmithingScreenHandlerMixin already computes the
# deterministic carried-over level and calls ItemScaling.rescale(stack, level),
# but our AttributeModifierMixin was re-rolling "power" randomly on every
# scale() call regardless of source, and ItemScalingMixin's 25% gate was also
# stripping it outright on top of that. New RescaleGuardMixin marks when a
# rescale() is in progress (via PowerLevelContext) so the other two mixins
# skip their loot-roll randomness and just apply dungeon_difficulty's own
# already-correct deterministic level during upgrades, while leaving the
# original loot-drop random behavior untouched.
#
# 1.0.2: fixed armor/weapon-damage bonuses silently ignoring the rolled power
# level and using the zone's raw area level instead, whenever that attribute
# was listed before "power" in difficulty_v2.json's attribute list (weapons:
# [damage, power]; armor: [armor, power, health]) - "power" used to roll its
# random level lazily, only when its own entry was reached, so entries earlier
# in the list fell back to the unmodified raw level. The shared power level is
# now rolled once, up front, in ItemScalingMixin's gate check (only when the
# 25% gate actually passes), before any attribute in the list is processed -
# so armor/damage/power/health all read the same rolled value regardless of
# config order.
#
# 1.0.7 (2026-10-23, several intermediate debug builds not individually kept):
# fixed material-upgrade smithing (diamond/netherite -> metallurgium/celestium/
# warden/etc.) losing power-level stat corrections outright. Root cause:
# UniversalSmithingUpgradeMixin was reading the smithing input's TEMPLATE slot
# (comp_2677) instead of the BASE slot (comp_2678) when checking whether the
# base item was scaled - always false, so the mixin silently no-op'd on every
# upgrade regardless of whether its @Redirect fired at all. Fixed the accessor;
# also added a FrostResistanceOverride pass (new class) that re-applies
# Frostiful's frost-resistance component by exact item id after any
# material-changing smithing upgrade, since vanilla's transmuteCopy carries the
# OLD material's stale explicit component forward otherwise (affects netherite,
# palladium, netherite-tier berserker/destroyer/onslaught armor, warden,
# metallurgium/celestium, immersive_armors wither set, iceandfire fire
# dragonsteel - full curated list in config/makujannu_frostresistance.json,
# re-checked by StaleScaledGearHealer's existing 5-minute sweep too). Also
# fixed the same stale-stat-carryover issue for items with NO power level at
# all (previously only items that already had a dd.rsf tag got reset on
# upgrade; now ItemScaling.removeScaling() runs unconditionally on any
# material-changing upgrade so an unscaled item picks up the new material's
# own defaults instead of the old material's frozen stats).
#
# Known open issue, not yet fixed: upgrading an already power-scaled item on a
# recipe dungeon_difficulty's own SmithingScreenHandlerMixin ALSO recognizes
# (netherite, warden - anything with "upgrade" in its template item id) can
# still occasionally lose the frost-resistance correction. Suspected cause is
# mixin-ordering interaction between this mod's @Redirect and dungeon_difficulty's
# own @WrapOperation on the same craft() call (unconfirmed without live debug
# logging, which was deferred per admin request - see 패치노트.txt 2026-10-23
# entries for the full investigation writeup).
